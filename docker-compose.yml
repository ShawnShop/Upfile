services:
  postgres:
    image: postgres:16-alpine
    container_name: kbase-postgres
    restart: always
    environment:
      POSTGRES_DB: kbase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
